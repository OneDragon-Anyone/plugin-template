# 兼容转发：校验逻辑已迁到 plugin-tools。仍引用 plugin-template@master 的旧仓库会自动走新工具。
# 新仓库请直接引用 OneDragon-Anyone/plugin-tools 的同名工作流。
name: Reusable Plugin Validate (forwarder)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"

permissions:
  contents: read

jobs:
  validate:
    uses: OneDragon-Anyone/plugin-tools/.github/workflows/reusable-validate.yml@v1
    with:
      python-version: ${{ inputs.python-version }}
