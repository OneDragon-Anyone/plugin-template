# 兼容转发：发布逻辑已迁到 plugin-tools。仍引用 plugin-template@master 的旧仓库会自动走新工具。
# 新仓库请直接引用 OneDragon-Anyone/plugin-tools 的同名工作流。
name: Reusable Plugin Release (forwarder)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    uses: OneDragon-Anyone/plugin-tools/.github/workflows/reusable-release.yml@v1
    with:
      python-version: ${{ inputs.python-version }}
